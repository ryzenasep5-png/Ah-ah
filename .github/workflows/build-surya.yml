name: Build Poco X3 NFC kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-surya.yml"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: ryzenx-surya-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux 4.14.117 (surya baseline)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex gcc-aarch64-linux-gnu git libssl-dev libncurses-dev lz4 make python3 rsync unzip wget

      - name: Checkout pinned Xiaomi kernel source
        env:
          SOURCE_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
          SOURCE_BRANCH: surya-q-oss
          SOURCE_COMMIT: 5e0a8dada006832d3c0511fdc7903c68474cad87
        run: |
          git clone --filter=blob:none --no-checkout --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" kernel
          cd kernel
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          git log -1 --format='%H%n%s' | tee ../source-commit.txt

      - name: Patch legacy GCC wrapper for Python 3
        run: |
          cd kernel
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/gcc-wrapper.py")
          s = p.read_text()
          replacements = {
              'print >> sys.stderr, "error, forbidden warning:", m.group(2)': 'print("error, forbidden warning:", m.group(2), file=sys.stderr)',
              'print >> sys.stderr, line,': 'sys.stderr.write(line)',
              "print >> sys.stderr, args[0] + ':',e.strerror": "print(args[0] + ':', e.strerror, file=sys.stderr)",
              "print >> sys.stderr, 'Is your PATH set correctly?'": "print('Is your PATH set correctly?', file=sys.stderr)",
              "print >> sys.stderr, ' '.join(args), str(e)": "print(' '.join(args), str(e), file=sys.stderr)",
              'subprocess.Popen(args, stderr=subprocess.PIPE)': 'subprocess.Popen(args, stderr=subprocess.PIPE, universal_newlines=True)',
              '#! /usr/bin/env python2': '#! /usr/bin/env python3',
          }
          for before, after in replacements.items():
              if before not in s:
                  raise SystemExit("Expected legacy wrapper text not found: " + before)
              s = s.replace(before, after)
          if "print >>" in s:
              raise SystemExit("Unconverted Python 2 print syntax remains")
          # Allow only exact legacy GCC warning locations reviewed for this 4.14 tree.
          marker = "allowed_warnings = set(["
          if marker not in s:
              raise SystemExit("GCC wrapper warning allowlist not found")
          s = s.replace(marker, marker + '\n    "thread_info.h:108",\n    "cmpxchg.h:38",\n    "atomic_ll_sc.h:259",\n', 1)
          p.write_text(s)
          PY
          # Fix a real printf type mismatch in the legacy surya source.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("arch/arm64/kernel/bootinfo.c")
          s = p.read_text()
          old = 'seq_printf(m, "%lu.%02lu\\n", maxfreq/100, maxfreq%100);'
          new = 'seq_printf(m, "%u.%02u\\n", maxfreq/100, maxfreq%100);'
          if old not in s:
              raise SystemExit("Expected cpumaxfreq format string not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Fix verified legacy source warnings
        run: |
          cd kernel
          python3 - <<'PY'
          from pathlib import Path

          # Fix a misleadingly indented unconditional exit in the EBUSY path.
          p = Path("security/pfe/pfk_ice.c")
          s = p.read_text()
          old = '''\t\tif (ret == -EBUSY) {
          \t\t\tif (qcom_ice_setup_ice_hw((const char *)s_type, false))
          \t\t\t\tpr_err("%s: clock disable failed\\n", __func__);
          \t\t\t\tgoto out;
          \t\t}'''
          new = '''\t\tif (ret == -EBUSY) {
          \t\t\tif (qcom_ice_setup_ice_hw((const char *)s_type, false))
          \t\t\t\tpr_err("%s: clock disable failed\\n", __func__);
          \t\t\tgoto out;
          \t\t}'''
          if old not in s:
              raise SystemExit("Expected pfk_ice EBUSY block not found")
          p.write_text(s.replace(old, new, 1))

          # Handle packed session_key only within decrypt_pki_encrypted_session_key.
          p = Path("fs/ecryptfs/keystore.c")
          s = p.read_text()
          fn_start = s.index("decrypt_pki_encrypted_session_key(")
          fn_end = s.index("\nstatic void wipe_auth_tok_list", fn_start)
          fn = s[fn_start:fn_end]
          old_decl = "\tsize_t payload_len = 0;\n\tint rc;"
          new_decl = "\tsize_t payload_len = 0;\n\tstruct ecryptfs_session_key session_key;\n\tint rc;"
          if old_decl not in fn:
              raise SystemExit("Expected decrypt_pki local declarations not found")
          fn = fn.replace(old_decl, new_decl, 1)
          old_write = "\trc = write_tag_64_packet(auth_tok_sig, &(auth_tok->session_key),\n\t\t\t\t &payload, &payload_len);"
          new_write = "\tmemcpy(&session_key, (char *)auth_tok +\n\t       offsetof(struct ecryptfs_auth_tok, session_key),\n\t       sizeof(session_key));\n\trc = write_tag_64_packet(auth_tok_sig, &session_key,\n\t\t\t\t &payload, &payload_len);"
          if old_write not in fn:
              raise SystemExit("Expected decrypt_pki packed write_tag call not found")
          fn = fn.replace(old_write, new_write, 1)
          old_parse = "\trc = parse_tag_65_packet(&(auth_tok->session_key),\n\t\t\t\t &cipher_code, msg);"
          new_parse = "\trc = parse_tag_65_packet(&session_key,\n\t\t\t\t &cipher_code, msg);"
          if old_parse not in fn:
              raise SystemExit("Expected decrypt_pki packed parse call not found")
          fn = fn.replace(old_parse, new_parse, 1)
          old_fields = "\tauth_tok->session_key.flags |= ECRYPTFS_CONTAINS_DECRYPTED_KEY;\n\tmemcpy(crypt_stat->key, auth_tok->session_key.decrypted_key,\n\t       auth_tok->session_key.decrypted_key_size);\n\tcrypt_stat->key_size = auth_tok->session_key.decrypted_key_size;"
          new_fields = "\tsession_key.flags |= ECRYPTFS_CONTAINS_DECRYPTED_KEY;\n\tmemcpy((char *)auth_tok +\n\t       offsetof(struct ecryptfs_auth_tok, session_key),\n\t       &session_key, sizeof(session_key));\n\tmemcpy(crypt_stat->key, session_key.decrypted_key,\n\t       session_key.decrypted_key_size);\n\tcrypt_stat->key_size = session_key.decrypted_key_size;"
          if old_fields not in fn:
              raise SystemExit("Expected decrypt_pki packed field accesses not found")
          fn = fn.replace(old_fields, new_fields, 1)
          s = s[:fn_start] + fn + s[fn_end:]
          p.write_text(s)

          # Avoid collision with the C library's built-in free() declaration.
          p = Path("crypto/xts.c")
          s = p.read_text()
          if s.count("static void free(struct skcipher_instance *inst)") != 1 or s.count("inst->free = free;") != 1:
              raise SystemExit("Expected XTS free callback declarations not found")
          s = s.replace("static void free(struct skcipher_instance *inst)", "static void xts_free(struct skcipher_instance *inst)", 1)
          s = s.replace("inst->free = free;", "inst->free = xts_free;", 1)
          p.write_text(s)

          # Fully initialize ext4 extent temporaries; GCC 12 detects a possible
          # read of zero_ex2.ee_start_lo after only ee_len was initialized.
          p = Path("fs/ext4/extents.c")
          s = p.read_text()
          old = "struct ext4_extent zero_ex1, zero_ex2;"
          new = "struct ext4_extent zero_ex1 = { 0 }, zero_ex2 = { 0 };"
          if s.count(old) != 1:
              raise SystemExit("Expected ext4 zero extent declaration not found uniquely")
          p.write_text(s.replace(old, new, 1))

          # Correct misleading indentation in ext4 encrypted-page handling.
          # The IS_ERR check is a sibling of the hardware-encryption condition.
          p = Path("fs/ext4/page-io.c")
          s = p.read_text()
          old = """\tretry_encrypt:
\tif (!fscrypt_using_hardware_encryption(inode))
\t\tdata_page = fscrypt_encrypt_page(inode, page, PAGE_SIZE, 0,
\t\t\t\t\t\tpage->index, gfp_flags);
\t\tif (IS_ERR(data_page)) {
\t\t\tret = PTR_ERR(data_page);
\t\t\tif (ret == -ENOMEM && wbc->sync_mode == WB_SYNC_ALL) {
\t\t\t\tif (io->io_bio) {
\t\t\t\t\text4_io_submit(io);
\t\t\t\t\tcongestion_wait(BLK_RW_ASYNC, HZ/50);
\t\t\t\t}
\t\t\t\tgfp_flags |= __GFP_NOFAIL;
\t\t\t\tgoto retry_encrypt;
\t\t\t}
\t\t\tdata_page = NULL;
\t\t\tgoto out;
\t\t}
\t}"""
          new = """\tretry_encrypt:
\tif (!fscrypt_using_hardware_encryption(inode))
\t\tdata_page = fscrypt_encrypt_page(inode, page, PAGE_SIZE, 0,
\t\t\t\t\t\tpage->index, gfp_flags);
\tif (IS_ERR(data_page)) {
\t\tret = PTR_ERR(data_page);
\t\tif (ret == -ENOMEM && wbc->sync_mode == WB_SYNC_ALL) {
\t\t\tif (io->io_bio) {
\t\t\t\text4_io_submit(io);
\t\t\t\tcongestion_wait(BLK_RW_ASYNC, HZ/50);
\t\t\t}
\t\t\tgfp_flags |= __GFP_NOFAIL;
\t\t\tgoto retry_encrypt;
\t\t}
\t\tdata_page = NULL;
\t\tgoto out;
\t}
\t}"""
          if old not in s:
              raise SystemExit("Expected ext4 page-io encryption block not found")
          p.write_text(s.replace(old, new, 1))

          # The debugfs callback formats a u64 value, not unsigned long.
          p = Path("mm/cma_debug.c")
          s = p.read_text()
          old_fmt = 'DEFINE_SIMPLE_ATTRIBUTE(cma_debugfs_fops, cma_debugfs_get, NULL, "0x%lx\\n");'
          new_fmt = 'DEFINE_SIMPLE_ATTRIBUTE(cma_debugfs_fops, cma_debugfs_get, NULL, "0x%llx\\n");'
          if old_fmt not in s:
              raise SystemExit("Expected CMA debugfs format string not found")
          p.write_text(s.replace(old_fmt, new_fmt, 1))
          PY

      - name: Verify source version and defconfig
        run: |
          cd kernel
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 14$' Makefile
          grep -q '^SUBLEVEL = 117$' Makefile
          test -f arch/arm64/configs/vendor/sdmsteppe-perf_defconfig
          echo "Kernel Makefile: $(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | tr '\n' ' ')"
          echo "Defconfig: arch/arm64/configs/vendor/sdmsteppe-perf_defconfig"

      - name: Configure ARM64 kernel
        run: |
          cd kernel
          make O=../out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/sdmsteppe-perf_defconfig
          test -s ../out/.config
          grep -E '^(CONFIG_ARCH_SM6150|CONFIG_ARCH_SDMMAGPIE|CONFIG_QCOM_KGSL|CONFIG_THERMAL)=' ../out/.config || true

      - name: Build kernel image and device trees
        run: |
          cd kernel
          set -o pipefail
          # Linux 4.14's bundled DTC relies on common-symbol behavior removed by modern GCC defaults.
          make O=../out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon -j"$(nproc)" Image.gz-dtb dtbs 2>&1 | tee ../build.log

      - name: Validate outputs
        if: success()
        run: |
          test -s out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb | tee artifact-validation.txt
          sha256sum out/arch/arm64/boot/Image.gz-dtb | tee SHA256SUMS

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ryzenx-surya-build-logs
          path: |
            build.log
            source-commit.txt
            artifact-validation.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload kernel image and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ryzenx-surya-kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
